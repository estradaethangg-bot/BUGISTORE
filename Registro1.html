<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="./manifiesto.json">
<meta name="theme-color" content="#121212">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>        

    <!-- Archivos extra -->
    <script src="registro.js"></script>
    <link rel="stylesheet" href="registro.css">
</head>
<body style="background-color: black;">
    <div class="container-fluid py-5 ">
        <div class="row justify-content-center ">
            <div class="col-lg-6 col-md-8 col-sm-10">
                <div class="card shadow-lg p-4">
                    <h1 class="text-center mb-4 titulo">Regístrate</h1>
                    
                    <form>
                        <div class="mb-3">
                            <label for="txt_nombre" class="form-label camposTXT">Nombre:</label>
                            <input type="text" id="txt_nombre" class="form-control cajasTXT" placeholder="Tu nombre">
                        </div>

                        <div class="mb-3">
                            <label for="txt_ap1" class="form-label camposTXT">Apellido Paterno:</label>
                            <input type="text" id="txt_ap1" class="form-control cajasTXT" placeholder="Apellido paterno">
                        </div>

                        <div class="mb-3">
                            <label for="txt_ap2" class="form-label camposTXT">Apellido Materno:</label>
                            <input type="text" id="txt_ap2" class="form-control cajasTXT" placeholder="Apellido materno">
                        </div>

                        <div class="mb-3">
                            <label for="txt_edad" class="form-label camposTXT">Edad:</label>
                            <input type="number" id="txt_edad" class="form-control cajasTXT" placeholder="Tu edad">
                        </div>

                        <div class="mb-3">
                            <label class="form-label camposTXT">Sexo:</label><br>
                            <div class="form-check form-check-inline">
                                <input type="radio" name="sexo" value="1" id="rd_mas" class="form-check-input">
                                <label for="rd_mas" class="form-check-label camposTXT">Masculino</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input type="radio" name="sexo" value="2" id="rd_fem" class="form-check-input">
                                <label for="rd_fem" class="form-check-label camposTXT">Femenino</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input type="radio" name="sexo" value="3" id="rd_indefinido" class="form-check-input">
                                <label for="rd_indefinido" class="form-check-label camposTXT">Prefiero no decirlo</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="txt_user" class="form-label camposTXT">Username:</label>
                            <input type="text" id="txt_user" class="form-control cajasTXT" placeholder="Tu nombre de usuario">
                        </div>

                        <div class="mb-3">
                            <label for="txt_correo" class="form-label camposTXT">Correo:</label>
                            <input type="email" id="txt_correo" class="form-control cajasTXT" placeholder="correo@ejemplo.com">
                        </div>

                        <div class="mb-3">
                            <label for="txt_contraseña" class="form-label camposTXT">Contraseña:</label>
                            <input type="password" id="txt_contraseña" class="form-control cajasTXT" placeholder="Tu contraseña">
                        </div>

                        <div class="d-grid">
                            <button type="button" id="btn_registrate" class="btn btn-primary boton">Regístrate</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./servicio-worker.js")
      .then(registro => console.log("PWA registrada:", registro.scope))
      .catch(error => console.error("No se pudo registrar la PWA:", error));
  });
}
</script>
</body>
</html>
