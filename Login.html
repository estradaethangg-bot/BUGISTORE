
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Configuración de la PWA -->
    <link rel="manifest" href="./manifiesto.json">
    <meta name="theme-color" content="#121212">

    <title>Iniciar Sesión - BUGISTORE</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Estilos propios -->
    <link rel="stylesheet" href="./Styles/login.css">

    <!-- JavaScript del inicio de sesión -->
    <script src="./login.js" defer></script>
</head>

<body>
    <div class="container-fluid py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-sm-10 neon">
                <div class="card shadow-lg p-4">

                    <h1 class="text-center mb-4 titulo">
                        Iniciar Sesión
                    </h1>

                    <form id="form_login" onsubmit="return false;">

                        <div class="mb-3">
                            <label for="txt_correo" class="form-label camposTXT">
                                Correo:
                            </label>

                            <input
                                type="email"
                                id="txt_correo"
                                class="form-control cajasTXT"
                                placeholder="correo@ejemplo.com"
                                autocomplete="email"
                            >
                        </div>

                        <div class="mb-3">
                            <label for="txt_contraseña" class="form-label camposTXT">
                                Contraseña:
                            </label>

                            <input
                                type="password"
                                id="txt_contraseña"
                                class="form-control cajasTXT"
                                placeholder="Tu contraseña"
                                autocomplete="current-password"
                            >
                        </div>

                        <div class="d-grid mb-3">
                            <input
                                type="button"
                                id="btn_login"
                                class="btn btn-primary boton"
                                value="Iniciar Sesión"
                            >
                        </div>

                        <div class="d-grid">
                            <input
                                type="button"
                                id="btn_limpiar"
                                class="btn boton2"
                                value="Limpiar Campos"
                            >
                        </div>

                        <div class="registro-cta">
                            <span>¿No tienes una cuenta?</span>
                            <a href="./Registro.html" class="registro-link">Regístrate aquí</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Registrar el Service Worker -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", async () => {
                try {
                    const registro = await navigator.serviceWorker.register(
                        "/FINAL/servicio-worker.js"
                    );

                    console.log(
                        "PWA registrada correctamente:",
                        registro.scope
                    );
                } catch (error) {
                    console.error(
                        "Error al registrar la PWA:",
                        error
                    );
                }
            });
        }
    </script>
</body>
</html>
