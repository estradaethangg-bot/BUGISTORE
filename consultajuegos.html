<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="./manifiesto.json">
<meta name="theme-color" content="#121212">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="consulta.js"></script>
    <link rel="stylesheet" href="Styles/consulta.css">



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Juegos</title>

    
</head>
<body>
    <div class="container-fluid py-5">
        <div class="row justify-content-center">
        
          
            <div class="card shadow-lg p-4" style="width: 100%; max-width: 500px;">

                <h1 class="text-center texto"> Consulta tus juegos</h1>

 
                <form name="empleados" method="post">


                    <div class="mb-2">
                        <label class="form-label">Clave o nombre del juego:</label>
                        <input type="text"  id="txt_clave" placeholder="Ej. carreras-gran7 o Gran Turismo 7"><br>
                    </div>


                    <div class="mb-2">
                        <label class="form-label">Nombre del juego:</label>
                        <input type="text"  id="txt_nombre" placeholder="Nombre" disabled><br>
                    </div>

 
                    <div class="mb-2">
                        <label class="form-label">Categoría:</label>
                        <input type="text"  id="txt_genero" placeholder="Categoría" disabled><br>
                    </div>

 
                    <div class="mb-2">
                       <label class="form-label">Precio:</label>
                       <input type="text"  id="txt_precio" placeholder="Precio" disabled><br>
                    </div>


                    <div class="mb-2">
                       <label class="form-label">Disponibilidad:</label>
                       <input type="text"  id="txt_disp" placeholder="Disponibles" disabled><br>
                    </div>

 
                    <div class="d-grid gap-2">
                        <input type="button"  id="bt_buscar" value="Buscar">
                    </div>
                    
                </form>
            </div>    
        </div>
    </div>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./servicio-worker.js")
      .then(registro => console.log("PWA registrada:", registro.scope))
      .catch(error => console.error("No se pudo registrar la PWA:", error));
  });
}
</script>
</body>
</html>
