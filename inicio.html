  <script>
    // Actualización del contador del carrito.
    (function() {
      const badge = document.getElementById('contadorCarrito');

      function setCount(value) {
        if (badge) {
          badge.textContent = String(Math.max(0, Number(value) || 0));
        }
      }

      async function loadCount() {
        try {
          const r = await fetch(
            'api_carrito.php?accion=obtener',
            {
              cache: 'no-store',
              credentials: 'same-origin'
            }
          );

          const d = await r.json();

          if (d.ok) {
            setCount(d.count);
          }
        } catch (_) {}
      }

      window.addEventListener('message', function(e) {
        if (
          e.origin !== window.location.origin ||
          !e.data ||
          e.data.type !== 'bugistore-cart-updated'
        ) {
          return;
        }

        setCount(e.data.count);
      });

      window.addEventListener('pageshow', loadCount);
      loadCount();
    })();

    // Registro del Service Worker de la PWA.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker
          .register('./servicio-worker.js')
          .catch(function(error) {
            console.error('Error al registrar el Service Worker:', error);
          });
      });
    }

    // Confirmación antes de cerrar la sesión.
    document.addEventListener('DOMContentLoaded', function() {
      const botonCerrarSesion = document.querySelector('.logout-link');

      if (!botonCerrarSesion) return;

      botonCerrarSesion.addEventListener('click', async function(evento) {
        evento.preventDefault();

        const resultado = await Swal.fire({
          title: '¿Cerrar sesión?',
          text: '¿Estás seguro de que deseas salir de tu cuenta?',
          icon: 'question',
          showCancelButton: true,
          confirmButtonText: 'Sí, cerrar sesión',
          cancelButtonText: 'No, permanecer aquí',
          confirmButtonColor: '#be123c',
          cancelButtonColor: '#64748b',
          reverseButtons: true,
          focusCancel: true,
          allowOutsideClick: false
        });

        // Solo se dirige al cierre de sesión si confirma.
        if (resultado.isConfirmed) {
          window.location.href = botonCerrarSesion.href;
        }
      });
    });
  </script>
